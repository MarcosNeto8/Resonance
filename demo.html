<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div><img class="logo" src="logo.png" alt="Logo Resonance"></div>
  <button class="word" data-act="view" data-v="home">Resonance</button>
  <div class="tools">
    <button class="ib" id="sbtn" data-act="view" data-v="search" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <button class="ib" id="avbtn" data-act="view" data-v="profile" aria-label="Meu perfil"></button>
  </div>
</header>
<main>
  <section data-view="home">
    <div class="spslot"></div>
    <div class="cols">
      <article class="box" id="rate"></article>
      <section class="box"><h2>Catálogo</h2><div class="grid" id="cat"></div></section>
      <aside class="box"><h2>Descobre</h2><div id="rec"></div></aside>
    </div>
  </section>
  <section data-view="search" hidden>
    <form class="box form" id="sf" style="flex-direction:row">
      <h2>Pesquisar no Spotify</h2>
      <div><label for="q">Álbuns, artistas ou músicas</label><input id="q" placeholder="Ex.: Milton Nascimento"></div>
      <div><label for="ty">Tipo</label><select id="ty"><option value="album,artist,track">Tudo</option><option value="album">Álbuns</option><option value="artist">Artistas</option><option value="track">Músicas</option></select></div>
      <button class="btn acc" type="submit">Buscar</button>
    </form>
    <div class="grid" id="res" style="margin-top:18px"></div>
  </section>
  <section data-view="profile" hidden></section>
</main>
<footer>Projeto acadêmico fictício. Notas de 1 a 5 estrelas. Os pesos de gênero do catálogo de exemplo são ilustrativos.</footer>
<dialog id="pm">
  <form class="form" id="pf">
    <h2 id="pmt">Crie seu perfil</h2>
    <div class="pick"><div class="pav" id="pprev" style="width:80px;height:80px;font-size:1.8rem"></div>
      <div><label for="pfoto">Foto</label><input type="file" id="pfoto" accept="image/*"></div></div>
    <div><label for="puser">Nome de usuário</label><input id="puser" required pattern="[a-z0-9_.]{3,20}" placeholder="seu.nome" title="3 a 20 letras minúsculas, números, ponto ou _"></div>
    <div><label for="pname">Nome</label><input id="pname" required maxlength="40"></div>
    <div><label for="pbio">Bio <span class="meta" id="bcnt">0/150</span></label><textarea id="pbio" maxlength="150" placeholder="Fale um pouco sobre seu gosto musical"></textarea></div>
    <div class="fbar"><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn acc" type="submit">Salvar perfil</button></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
